# Decopon deployment. Keep both env files outside the checkout.
x-studio-common: &studio-common
  build: .
  image: flamoris-studio:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  studio:
    <<: *studio-common
    restart: unless-stopped
    env_file:
      - /etc/flamoris-studio/studio.env
    ports:
      - "127.0.0.1:5087:5087"
    volumes:
      - type: bind
        source: /srv/disk1/flamoris-studio/thumbnails
        target: /data/thumbnails
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5087/api/system/status', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    <<: *studio-common
    profiles: ["migrate"]
    env_file:
      - /etc/flamoris-studio/migrate.env
    command: ["alembic", "upgrade", "head"]
