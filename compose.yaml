# Generic deployment template. Keep runtime env files outside version control.
x-studio-common: &studio-common
  build: .
  image: flamoris-studio:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  studio:
    <<: *studio-common
    restart: unless-stopped
    env_file:
      - ${STUDIO_ENV_FILE:-./deploy/studio.env}
    ports:
      - "${STUDIO_BIND_HOST:-127.0.0.1}:${STUDIO_BIND_PORT:-5087}:5087"
    volumes:
      - type: bind
        source: ${STUDIO_THUMBNAILS_DIR:-./data/thumbnails}
        target: /data/thumbnails
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5087/api/system/status', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    <<: *studio-common
    profiles: ["migrate"]
    env_file:
      - ${STUDIO_MIGRATE_ENV_FILE:-./deploy/migrate.env}
    command: ["alembic", "upgrade", "head"]
