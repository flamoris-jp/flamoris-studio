[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26",
  "httpx2>=2.13,<3", "Pillow>=11,<13",
  "flamoris-intelligence-mcp @ https://github.com/flamoris-jp/flamoris-intelligence-mcp/archive/5da9736e60c29ed549d16656ff7acac5d54bdb83.zip",
]

[project.optional-dependencies]
test = [
  "flamoris-generation-controller[http] @ https://github.com/flamoris-jp/flamoris-generation-controller/archive/640a5bd48c76e4bf736e9a3589c216123ccd18b3.zip",
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1",
  "flamoris-ai-agent @ https://github.com/flamoris-jp/flamoris-ai-agent/archive/c6adca2727805a62348e2aade219ea20a8e2ee99.zip",
]

[tool.setuptools.packages.find]
include = ["flamoris_studio*"]
