[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-studio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["flamoris-update-core[owner] @ https://github.com/flamoris-jp/flamoris-updater/archive/797d6f4e7bd4089e7c162fa50c10a0afae68370a.zip#subdirectory=packages/update-core",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26",
  "httpx2>=2.13,<3", "Pillow>=11,<13",
  "flamoris-intelligence-mcp @ https://github.com/flamoris-jp/flamoris-intelligence-mcp/archive/f791bf236342e7c831e4d0291709bacb2f0e54bc.zip",
]

[project.optional-dependencies]
test = [
  "flamoris-generation-controller[http] @ https://github.com/flamoris-jp/flamoris-generation-controller/archive/eacf1086e28ca3eeb13b4297d4343fdec1163429.zip",
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1",
  "flamoris-ai-agent @ https://github.com/flamoris-jp/flamoris-ai-agent/archive/8ac1e9555355a5cbb255e8939f43ad041a0d221c.zip",
]

[tool.setuptools.packages.find]
include = ["flamoris_studio*"]

[project.scripts]
flamoris-studio-update-owner = "flamoris_studio.updater:main"
