[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-studio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["flamoris-update-core[owner] @ https://github.com/flamoris-jp/flamoris-updater/archive/d5ec3408d2a9b43ce44efef6ab8209a6b8ffad25.zip#subdirectory=packages/update-core",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26",
  "httpx2>=2.13,<3", "Pillow>=11,<13",
  "flamoris-intelligence-mcp @ https://github.com/flamoris-jp/flamoris-intelligence-mcp/archive/274fc9196036a937f7059caac861ada2346d09e7.zip",
]

[project.optional-dependencies]
test = [
  "flamoris-generation-controller[http] @ https://github.com/flamoris-jp/flamoris-generation-controller/archive/399ff53c2dbb8b13844ea8a40d6c4b65d9103fe9.zip",
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1",
  "flamoris-ai-agent @ https://github.com/flamoris-jp/flamoris-ai-agent/archive/9a41e3325525de8d26dde62912f4e42e04fe43e7.zip",
]

[tool.setuptools.packages.find]
include = ["flamoris_studio*"]

[project.scripts]
flamoris-studio-update-owner = "flamoris_studio.updater:main"
