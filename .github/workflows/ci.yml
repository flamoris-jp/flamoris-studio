name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: studio_test, POSTGRES_USER: studio_test, POSTGRES_PASSWORD: studio_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U studio_test" --health-interval=10s --health-timeout=5s --health-retries=5
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Restore server
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: dotnet restore src/Flamoris.Studio.Server/Flamoris.Studio.Server.csproj --configfile NuGet.Config
      - name: Restore tests
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: dotnet restore tests/Flamoris.Studio.Server.Tests/Flamoris.Studio.Server.Tests.csproj --configfile NuGet.Config
      - run: dotnet build src/Flamoris.Studio.Server/Flamoris.Studio.Server.csproj --no-restore
      - name: Backend tests
        env:
          ConnectionStrings__Studio: 'Host=localhost;Port=5432;Database=studio_test;Username=studio_test;Password=studio_test'
        run: dotnet test tests/Flamoris.Studio.Server.Tests/Flamoris.Studio.Server.Tests.csproj --no-restore
      - run: npm ci && npm run build && npm test
        working-directory: web
