name: Build reviewed v1 release candidate
on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eec497cc0dd2e044db1963f22d928fca84a08859
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = "eec497cc0dd2e044db1963f22d928fca84a08859"
      - name: Build candidate image
        run: docker build --pull --tag flamoris-studio:1.0.0 .
      - name: Import smoke
        run: docker run --rm --entrypoint python flamoris-studio:1.0.0 -c "import flamoris_studio.app"
      - name: Export immutable candidate
        shell: bash
        run: |
          mkdir -p candidate
          docker image inspect --format '{{.Id}}' flamoris-studio:1.0.0 > candidate/image-id.txt
          docker save flamoris-studio:1.0.0 | gzip -n -9 > candidate/flamoris-studio-1.0.0-linux-amd64.docker.tar.gz
          sha256sum candidate/flamoris-studio-1.0.0-linux-amd64.docker.tar.gz > candidate/SHA256SUMS
          printf '%s\n' '{"format_version":1,"application":"flamoris-studio","release":"1.0.0","platform":"linux/amd64","source_revision":"eec497cc0dd2e044db1963f22d928fca84a08859"}' > candidate/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: flamoris-studio-1.0.0-linux-amd64
          path: candidate/
          retention-days: 3
