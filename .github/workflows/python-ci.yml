name: Python Studio CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: studio_test, POSTGRES_USER: studio_test, POSTGRES_PASSWORD: studio_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U studio_test" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      STUDIO_DATABASE_URL: postgresql+psycopg://studio_test:studio_test@localhost:5432/studio_test
      STUDIO_DEV_INSECURE_COOKIE: '1'
      STUDIO_ALLOW_REGISTRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e '.[test]'
      - run: alembic upgrade head
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build && npm test
        working-directory: web

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag flamoris-studio:ci .
      - name: Check packaged server and frontend
        run: |
          docker run --rm --entrypoint python flamoris-studio:ci -c "import flamoris_studio.app; from pathlib import Path; assert Path('/app/web/dist/index.html').is_file()"
